name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    name: Build, Test, Publish, Smoke, Package
    # A cold restore, build, coverage run and NativeAOT publish is 20-30 minutes on a hosted
    # runner; anything past this is a hang, not a slow run, and GitHub's default is six hours.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # build.ps1 is the single definition of the pipeline: restore, build with a zero-warning
      # budget, test with -c Release (load-bearing next to --no-build) and coverage, NativeAOT
      # publish with a zero-own-warning budget, run the PUBLISHED exe with --smoke, then stage
      # the release zip so packaging is exercised on every push, not only on a tag. Anything CI
      # does that the script does not is a difference nobody can reproduce locally.
      - name: Build, test, publish, smoke, package
        shell: pwsh
        run: ./build.ps1 -Package
        env:
          DOTNET_NOLOGO: 1
          DOTNET_CLI_TELEMETRY_OPTOUT: 1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: NeonSidekick-win-x64
          path: |
            publish/package/*.zip
            publish/package/*.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: publish/coverage/**/coverage.cobertura.xml
          retention-days: 7
          if-no-files-found: ignore

      # --blame-hang (build.ps1) writes Sequence_*.xml (the tests run, last one the culprit) and a
      # process dump beside the coverage output when a test stops making progress.
      - name: Upload hang diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hang-diagnostics
          path: |
            publish/coverage/**/Sequence_*.xml
            publish/coverage/**/*.dmp
          retention-days: 7
          if-no-files-found: ignore

      - name: List publish output
        if: always()
        shell: pwsh
        run: Get-ChildItem -Path publish/output -Recurse | Select-Object FullName, Length
